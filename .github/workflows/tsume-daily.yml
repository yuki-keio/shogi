name: Daily tsume shogi

# 毎日 JST 4:00（= UTC 19:00）に、詰将棋の在庫を補充してデプロイし直す。
# 当日の7問はビルド時にHTMLへ焼き込んでいるので、在庫の補充が無い日も
# 「今日の問題」を出すためにデプロイまで必ず走らせる。
#
# 在庫が目標に届いても generate.ts は途中で帰らず、残り時間を質の上積みに使う。
# つまりこのジョブは毎晩 minutes 分をまるごと使い切る（理由は generate.ts の冒頭）。
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "生成にかける時間（分）"
        default: "45"
      want:
        description: "作りたい在庫数（初回に30日分そろえるなら 1:30,3:30,5:30,7:30,9:30,11:30,13:30。空なら既定の15日分）"
        default: ""

# 通常の push デプロイと同時に走るとデプロイが競合するので直列化する
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  # 在庫JSONをコミットするので write が要る。
  # GITHUB_TOKEN による push は他のワークフローを起動しないため、二重デプロイにはならない。
  contents: write

jobs:
  replenish-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Restore tsume solver
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: .engines/bin
          key: tsume-engine-kh-v1.1.0-${{ runner.os }}-${{ hashFiles('scripts/tsume/engine_setup.sh') }}

      - name: Build tsume solver
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: bash scripts/tsume/engine_setup.sh

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 1/3/5手の種は自己対局から採る。やねうら王WASMはリポジトリに入っているので
      # ビルドもキャッシュも要らない。runner は 4 vCPU なので子プロセスは2つまで。
      - name: Replenish problem pool
        run: |
          node scripts/tsume/generate.ts \
            --minutes="${{ github.event.inputs.minutes || '45' }}" \
            --selfplay-procs=2 \
            ${{ github.event.inputs.want && format('--want={0}', github.event.inputs.want) || '' }}

      # 作った問題はこの時点で保存する。あとの手順が失敗しても生成物を捨てないため。
      # 在庫が苦しいときほど後段で異常が出るので、順番が逆だと自力で回復できなくなる。
      - name: Commit new problems
        if: ${{ !cancelled() }}
        run: |
          if git diff --quiet -- tsume_data/pool; then
            echo "在庫に変更はありません"
            exit 0
          fi
          git add tsume_data/pool
          git commit -m "詰将棋: 在庫を補充"
          git pull --rebase --autostash
          git push

      - name: Plan the next 30 days
        id: plan
        run: |
          set +e
          node scripts/tsume/plan.ts
          code=$?
          set -e
          # 3 は「予定は作れたが在庫が心もとない」の合図（plan.ts の ALERT_EXIT_CODE）。
          # ここで止めると当日のデプロイまで止まって出題が古いままになるので、
          # 印だけ残して先へ進み、デプロイのあとにジョブを赤くする。
          # それ以外の異常終了は本当の故障なので、いつもどおりここで止める。
          if [ "$code" -eq 3 ]; then
            echo "unhealthy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$code"

      - name: Re-verify the problems going out
        run: node scripts/tsume/selfcheck.ts --daily=3

      # 出題予定は点検を通ってから保存する（欠陥のある問題を予定に残さないため）
      - name: Commit the schedule
        run: |
          if git diff --quiet -- tsume_data/daily tsume_data/registry.json; then
            echo "出題予定に変更はありません"
            exit 0
          fi
          git add tsume_data/daily tsume_data/registry.json
          git commit -m "詰将棋: 出題予定を更新"
          git pull --rebase --autostash
          git push

      - name: Build static assets
        run: npm run build

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_YUKILAB }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # デプロイまで終えてからジョブを赤くする。出題は今日のぶんが出たうえで、
      # 在庫の異常には気付けるようにするため。
      - name: Fail if the stock is unhealthy
        if: steps.plan.outputs.unhealthy == 'true'
        run: |
          echo "::error::詰将棋の在庫に問題があります。「Plan the next 30 days」の出力を確認してください"
          exit 1
